<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>홈 | 모모셀러</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link href="shared.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div>
      <h1>홈</h1>
      <p>오늘의 매출·주문 현황을 한눈에 보여드려요.</p>
    </div>
  </div>

  <div class="card" id="dashCard">
    <div id="dashComingSoon">
      <span class="soon-badge">연동 준비 중</span>
      <h2>오늘 대시보드</h2>
      <p class="hint" style="margin-top:0;">
        쿠팡 실시간 연동 작업 중이에요 (쿠팡 쪽 접속 인증 문제를 확인하고 있어요). 조금만 기다려주세요.
      </p>
    </div>
    <div id="dashLive" style="display:none;">
      <h2>오늘 대시보드 <span id="dashDate" style="font-size:12px; color:var(--ink-soft); font-weight:400;"></span></h2>
      <div id="dashLoading" class="empty-note">불러오는 중...</div>
      <div id="dashError" class="status err" style="display:none;"></div>
      <div id="dashStats" style="display:none;">
        <div class="stat-grid">
          <div class="stat-box"><div class="stat-label">총매출</div><div class="stat-value" id="statRevenue">-</div></div>
          <div class="stat-box"><div class="stat-label">주문건수</div><div class="stat-value" id="statOrders">-</div></div>
          <div class="stat-box"><div class="stat-label">신규주문</div><div class="stat-value" id="statNew">-</div></div>
          <div class="stat-box"><div class="stat-label">발송대기</div><div class="stat-value" id="statAwaiting">-</div></div>
        </div>
        <p class="hint" style="margin-top:0;">쿠팡 기준이에요. 문의·취소/반품/교환 건수와 네이버 연동은 아직 준비 중이에요.</p>
      </div>
    </div>
  </div>

</div>

<nav class="bottom-nav"><div class="bottom-nav-inner">
  <a href="home.html" class="nav-item active"><span class="nav-icon">🏠</span><span>홈</span></a>
  <a href="index.html" class="nav-item"><span class="nav-icon">✍️</span><span>프롬프트</span></a>
  <a href="settlement.html" class="nav-item"><span class="nav-icon">📊</span><span>정산</span></a>
  <a href="analysis.html" class="nav-item"><span class="nav-icon">📈</span><span>분석</span></a>
  <a href="my.html" class="nav-item"><span class="nav-icon">👤</span><span>마이</span></a>
</div></nav>

<script>
// Coupang's IP allowlist doesn't work with Supabase Edge Functions' rotating
// outbound IPs yet - flip this back on once that's sorted out (see my.html /
// the coupang-summary function, both still fully working under the hood).
const COUPANG_DASHBOARD_LIVE = false;

requireAuth(function(){
  if(COUPANG_DASHBOARD_LIVE){
    document.getElementById('dashComingSoon').style.display = 'none';
    document.getElementById('dashLive').style.display = 'block';
    loadDashboard();
  }
});

async function loadDashboard(){
  const loadingEl = document.getElementById('dashLoading');
  const errorEl = document.getElementById('dashError');
  const statsEl = document.getElementById('dashStats');

  loadingEl.style.display = 'block';
  errorEl.style.display = 'none';
  statsEl.style.display = 'none';

  const { data, error } = await sb.functions.invoke('coupang-summary');

  loadingEl.style.display = 'none';

  if(error || !data || data.error){
    errorEl.textContent = data?.error || ('불러오기 실패: ' + (await getInvokeErrorMessage(error)));
    errorEl.style.display = 'block';
    return;
  }

  document.getElementById('dashDate').textContent = data.date ? `(${data.date} 기준)` : '';
  document.getElementById('statRevenue').textContent = formatWon(data.totalRevenue);
  document.getElementById('statOrders').textContent = data.orderCount + '건';
  document.getElementById('statNew').textContent = data.newOrders + '건';
  document.getElementById('statAwaiting').textContent = data.awaitingShipment + '건';
  statsEl.style.display = 'block';
}

function formatWon(n){
  return (n || 0).toLocaleString('ko-KR') + '원';
}
</script>
</body>
</html>
