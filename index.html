  <div class="masthead">

      <h1>모모셀러</h1>
      <p>AI로 만든 상품 정보를 내 계정에 저장할 수 있어요.</p>

      <button class="icon-btn" onclick="sharePage()" aria-label="공유하기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg></button>

  <!-- 로그인 화면 -->
  <div id="authView">
    <div class="card">
      <div id="authSignin">
        <h2>로그인</h2>
        <div class="field-block">
          <label for="siEmail">이메일</label>
          <input type="email" id="siEmail" placeholder="you@example.com">
        </div>
        <div class="field-block">
          <label for="siPassword">비밀번호</label>
          <input type="password" id="siPassword" placeholder="비밀번호">
        </div>
        <button class="primary" onclick="signIn()">로그인</button>
        <div class="status" id="siStatus"></div>
        <div class="switch-link" onclick="showSignup()">계정이 없으신가요? 회원가입</div>
      </div>

      <div id="authSignup">
        <h2>회원가입</h2>
        <div class="field-block">
          <label for="suEmail">이메일</label>
          <input type="email" id="suEmail" placeholder="you@example.com">
        </div>
        <div class="field-block">
          <label for="suPassword">비밀번호 (6자 이상)</label>
          <input type="password" id="suPassword" placeholder="비밀번호">
        </div>
        <button class="primary" onclick="signUp()">회원가입</button>
        <div class="status" id="suStatus"></div>
        <div class="switch-link" onclick="showSignin()">이미 계정이 있으신가요? 로그인</div>
      </div>
    </div>
  </div>

  <!-- 로그인 후 화면 -->

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h2 style="margin:0;">상품 정보</h2>
        <button type="button" class="mini-btn" onclick="startNewDraft()">새로 만들기</button>
      </div>
      <div class="row" style="margin-bottom:14px;">
        <div>
          <label for="category">카테고리</label>
          <select id="category">
            <option value="">선택 안 함</option>
            <option value="패션·의류">패션·의류</option>
            <option value="가방·신발·잡화">가방·신발·잡화</option>
            <option value="뷰티·화장품">뷰티·화장품</option>
            <option value="식품">식품</option>
            <option value="건강·생활">건강·생활</option>
            <option value="주방용품">주방용품</option>
            <option value="가구·인테리어">가구·인테리어</option>
            <option value="가전·디지털">가전·디지털</option>
            <option value="출산·유아동">출산·유아동</option>
            <option value="스포츠·레저">스포츠·레저</option>
            <option value="자동차용품">자동차용품</option>
            <option value="반려동물">반려동물</option>
            <option value="문구·사무용품">문구·사무용품</option>
            <option value="완구·취미">완구·취미</option>
            <option value="도서·음반">도서·음반</option>
            <option value="여행·티켓">여행·티켓</option>
            <option value="기타">기타</option>
          </select>
        </div>
        <div>
          <label for="tone">톤</label>
          <select id="tone">
            <option value="친근하고 신뢰감 있게">친근하게</option>
            <option value="전문적이고 신뢰감 있게">전문적으로</option>
            <option value="트렌디하고 감각적으로">트렌디하게</option>
            <option value="가성비를 강조하며 실속있게">가성비 강조</option>
          </select>
        </div>
      </div>
      <div class="field-block">
        <label for="brand">브랜드명 (없으면 비워두세요)</label>
        <input type="text" id="brand" placeholder="예) JAJU">
      </div>
      <div class="field-block">
        <label>판매처 (복수 선택 가능)</label>

            <input type="checkbox" id="marketCoupang" checked style="width:auto; cursor:pointer;"> 쿠팡
          </label>
          <label style="display:flex; align-items:center; gap:6px; font-size:13.5px; color:var(--ink); cursor:pointer;">
            <input type="checkbox" id="marketStore" checked style="width:auto; cursor:pointer;"> 스마트스토어
          </label>
        </div>
      </div>
      <div class="field-block">
        <label for="input">상품 설명 (대충 적어도 돼요)</label>
        <textarea id="input" style="min-height:84px;" placeholder="예) 겨울에 입는 두꺼운 기모 후드티, 남녀공용, 색은 검정 회색 베이지 3가지, 원단 도톰함"></textarea>
      </div>
      <div class="field-block">
        <label for="includeKeywords">핵심 키워드 (선택, 쉼표로 구분)</label>
        <input type="text" id="includeKeywords" placeholder="예) 캠핑, 미니멀">
      </div>
      <div class="field-block">
        <label for="excludeKeywords">제외 키워드 (선택, 쉼표로 구분)</label>
        <input type="text" id="excludeKeywords" placeholder="예) 대용량, 프리미엄">
      </div>
      <div id="aiGenControls" style="display:none;">
        <div class="field-block">
          <label for="aiGenCount">한 번에 몇 개 만들까요?</label>
          <select id="aiGenCount" onchange="updateAiGenControls(); saveDraft();">
            <option value="1">1개</option>
          </select>
        </div>
        <div id="extraDescriptions"></div>
        <button class="primary" id="aiGenBtn" onclick="generateWithAI()">✨ AI로 만들기</button>
        <div class="hint" style="text-align:center;">무료 소진 후에도 충전하면 충전 갯수만큼 계속 만들 수 있어요</div>
      </div>
      <div class="status" id="genStatus"></div>

      <div id="chargeSection" style="display:none; margin-top:14px; padding-top:14px; border-top:1px dashed var(--line);">
        <div class="field-block">
          <label for="chargeTier">충전할 개수</label>
          <select id="chargeTier">
            <option value="10">10개 - 500원</option>
            <option value="100">100개 - 4,900원</option>
            <option value="1000">1000개 - 48,000원</option>
          </select>
        </div>
        <button class="primary" onclick="showChargeInfo()">충전하기</button>

        <div id="chargeInfoBox" style="display:none; margin-top:14px;">
          <p class="hint" style="margin-top:0;">
            아래 계좌로 <b id="chargeAmountText"></b>을 입금해주세요.<br>
            <b>카카오뱅크 3333333335468</b> (예금주: 편지혜)
          </p>
          <button class="primary" onclick="submitChargeRequest()">입금 완료, 충전 요청하기</button>
          <div class="status" id="chargeRequestStatus"></div>
        </div>
      </div>
    </div>

    <div class="card" id="aiResultCard" style="display:none;">
      <h2>✨ AI 생성 결과</h2>
      <div id="aiResultsContainer"></div>
      <div class="status" id="aiResultStatus"></div>
    </div>
  </div>

</div>

<script>
let currentUser = null;

async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if(session){
    onLoggedIn(session.user);
  }
  sb.auth.onAuthStateChange((event, session) => {
    if(event === 'SIGNED_IN' && session){
      onLoggedIn(session.user);
    } else if(event === 'SIGNED_OUT'){
      onLoggedOut();
    }
  });
}
init();

function onLoggedIn(user){
  currentUser = user;
  document.getElementById('authView').style.display = 'none';
  document.getElementById('appView').style.display = 'block';
  checkAiAccess().then(loadDraft);
}

const AI_FREE_LIMIT = 3;
const AI_MAX_BATCH = 5;
let aiIsPro = false;
let aiRemaining = 0;
let currentResults = [];

async function checkAiAccess(){
  const { data } = await sb.from('profiles').select('is_pro, ai_generations_used, ai_generations_limit').eq('id', currentUser.id).single();
  aiIsPro = !!(data && data.is_pro);
  const used = (data && data.ai_generations_used) || 0;
  const limit = (data && data.ai_generations_limit) ?? AI_FREE_LIMIT;
  aiRemaining = Math.max(0, limit - used);
  updateAiGenControls();
  document.getElementById('aiGenControls').style.display = 'block';
}

function updateAiGenControls(){
  const countSelect = document.getElementById('aiGenCount');
  const btn = document.getElementById('aiGenBtn');

  const maxCount = aiIsPro ? AI_MAX_BATCH : Math.max(1, Math.min(AI_MAX_BATCH, aiRemaining));
  const prevValue = countSelect.value || '1';
  countSelect.innerHTML = '';
  for(let i = 1; i <= maxCount; i++){
    const opt = document.createElement('option');
    opt.value = String(i);
    opt.textContent = `${i}개`;
    countSelect.appendChild(opt);
  }
  countSelect.value = countSelect.querySelector(`option[value="${prevValue}"]`) ? prevValue : '1';

  if(!aiIsPro && aiRemaining <= 0){
    btn.textContent = '✨ AI로 만들기 (무료 소진)';
    btn.disabled = true;
    countSelect.disabled = true;
    document.getElementById('chargeSection').style.display = 'block';
    return;
  }

  document.getElementById('chargeSection').style.display = 'none';
  countSelect.disabled = false;
  btn.disabled = false;
  const selectedCount = parseInt(countSelect.value, 10);
  renderExtraDescriptions(selectedCount);
  const countLabel = selectedCount > 1 ? `${selectedCount}개 ` : '';
  btn.textContent = aiIsPro
    ? `✨ AI로 ${countLabel}만들기 (Pro)`
    : `✨ AI로 ${countLabel}만들기 (무료 ${aiRemaining}회 남음)`;
}

function renderExtraDescriptions(count){
  const container = document.getElementById('extraDescriptions');
  const needed = Math.max(0, count - 1);

  while(container.children.length > needed){
    container.removeChild(container.lastElementChild);
  }
  while(container.children.length < needed){
    const idx = container.children.length + 2;
    const block = document.createElement('div');
    block.className = 'field-block';

    const label = document.createElement('label');
    label.textContent = `상품 설명 ${idx}`;
    block.appendChild(label);

    const textarea = document.createElement('textarea');
    textarea.className = 'extra-desc';
    textarea.style.minHeight = '84px';
    textarea.placeholder = `상품 ${idx}에 대한 설명을 적어주세요`;
    block.appendChild(textarea);

    container.appendChild(block);
  }
}

const CHARGE_TIERS = { 10: 500, 100: 4900, 1000: 48000 };

function showChargeInfo(){
  const tier = document.getElementById('chargeTier').value;
  const price = CHARGE_TIERS[tier];
  document.getElementById('chargeAmountText').textContent = `${price.toLocaleString('ko-KR')}원`;
  document.getElementById('chargeInfoBox').style.display = 'block';
}

async function submitChargeRequest(){
  const tier = parseInt(document.getElementById('chargeTier').value, 10);
  const price = CHARGE_TIERS[tier];
  const statusEl = document.getElementById('chargeRequestStatus');

  statusEl.textContent = '요청 접수 중...';
  statusEl.className = 'status';

  const { error } = await sb.from('charge_requests').insert({
    user_id: currentUser.id,
    email: currentUser.email,
    credits: tier,
    price_won: price,
  });

  if(error){
    statusEl.textContent = '요청 실패: ' + error.message;
    statusEl.className = 'status err';
    return;
  }

  statusEl.textContent = '충전 요청 접수됐어요. 입금 확인 후 운영자가 충전해드려요.';
  statusEl.className = 'status ok';
}

function onLoggedOut(){
  currentUser = null;
  document.getElementById('authView').style.display = 'block';
  document.getElementById('appView').style.display = 'none';
}

function showSignup(){
  document.getElementById('authSignin').style.display = 'none';
  document.getElementById('authSignup').style.display = 'block';
}
function showSignin(){
  document.getElementById('authSignup').style.display = 'none';
  document.getElementById('authSignin').style.display = 'block';
}

async function signUp(){
  const email = document.getElementById('suEmail').value.trim();
  const password = document.getElementById('suPassword').value;
  const statusEl = document.getElementById('suStatus');
  if(!email || !password){
    statusEl.textContent = '이메일과 비밀번호를 입력해주세요.';
    statusEl.className = 'status err';
    return;
  }
  statusEl.textContent = '가입 중...';
  statusEl.className = 'status';
  const { data, error } = await sb.auth.signUp({ email, password });
  if(error){
    statusEl.textContent = error.message;
    statusEl.className = 'status err';
    return;
  }
  if(data.session){
    statusEl.textContent = '';
    onLoggedIn(data.user);
  } else {
    statusEl.textContent = '가입 완료! 이메일함에서 인증 링크를 확인해주세요.';
    statusEl.className = 'status ok';
  }
}

async function signIn(){
  const email = document.getElementById('siEmail').value.trim();
  const password = document.getElementById('siPassword').value;
  const statusEl = document.getElementById('siStatus');
  if(!email || !password){
    statusEl.textContent = '이메일과 비밀번호를 입력해주세요.';
    statusEl.className = 'status err';
    return;
  }
  statusEl.textContent = '로그인 중...';
  statusEl.className = 'status';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){
    statusEl.textContent = '로그인 실패: ' + error.message;
    statusEl.className = 'status err';
    return;
  }
  statusEl.textContent = '';
}

function getSelectedMarkets(){
  const markets = [];
  if(document.getElementById('marketCoupang').checked) markets.push('coupang');
  if(document.getElementById('marketStore').checked) markets.push('smartstore');
  return markets;
}

const DRAFT_KEY = 'momoseller_draft';

function saveDraft(){
  const draft = {
    category: document.getElementById('category').value,
    tone: document.getElementById('tone').value,
    brand: document.getElementById('brand').value,
    marketCoupang: document.getElementById('marketCoupang').checked,
    marketStore: document.getElementById('marketStore').checked,
    input: document.getElementById('input').value,
    includeKeywords: document.getElementById('includeKeywords').value,
    excludeKeywords: document.getElementById('excludeKeywords').value,
    aiGenCount: document.getElementById('aiGenCount').value,
    extraDescs: Array.from(document.querySelectorAll('.extra-desc')).map(el => el.value),
    results: currentResults,
  };
  sessionStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
}

function loadDraft(){
  const raw = sessionStorage.getItem(DRAFT_KEY);
  if(!raw) return;
  let draft;
  try{ draft = JSON.parse(raw); } catch(err){ return; }

  document.getElementById('category').value = draft.category || '';
  document.getElementById('tone').value = draft.tone || '친근하고 신뢰감 있게';
  document.getElementById('brand').value = draft.brand || '';
  document.getElementById('marketCoupang').checked = draft.marketCoupang !== false;
  document.getElementById('marketStore').checked = draft.marketStore !== false;
  document.getElementById('input').value = draft.input || '';
  document.getElementById('includeKeywords').value = draft.includeKeywords || '';
  document.getElementById('excludeKeywords').value = draft.excludeKeywords || '';

  const countSelect = document.getElementById('aiGenCount');
  if(draft.aiGenCount) countSelect.value = draft.aiGenCount;
  updateAiGenControls();
  (draft.extraDescs || []).forEach((val, i) => {
    const el = document.querySelectorAll('.extra-desc')[i];
    if(el) el.value = val;
  });

  if(Array.isArray(draft.results) && draft.results.length){
    currentResults = [];
    document.getElementById('aiResultsContainer').innerHTML = '';
    document.getElementById('aiResultCard').style.display = 'block';
    draft.results.forEach(r => {
      renderAiResult(r.text, r.index, r.total, r.meta);
      currentResults.push(r);
    });
  }
}

function startNewDraft(){
  if(currentResults.length && !confirm('지금 만든 결과가 모두 사라져요. 새로 만들까요?')){
    return;
  }
  sessionStorage.removeItem(DRAFT_KEY);
  currentResults = [];

  document.getElementById('category').value = '';
  document.getElementById('tone').value = '친근하고 신뢰감 있게';
  document.getElementById('brand').value = '';
  document.getElementById('marketCoupang').checked = true;
  document.getElementById('marketStore').checked = true;
  document.getElementById('input').value = '';
  document.getElementById('includeKeywords').value = '';
  document.getElementById('excludeKeywords').value = '';
  document.getElementById('genStatus').textContent = '';

  document.getElementById('aiResultsContainer').innerHTML = '';
  document.getElementById('aiResultCard').style.display = 'none';

  document.getElementById('aiGenCount').value = '1';
  updateAiGenControls();
  document.getElementById('input').focus();
}

['category', 'tone', 'brand', 'input', 'includeKeywords', 'excludeKeywords'].forEach(id => {
  document.getElementById(id).addEventListener('input', saveDraft);
});
document.getElementById('marketCoupang').addEventListener('change', saveDraft);
document.getElementById('marketStore').addEventListener('change', saveDraft);
document.getElementById('extraDescriptions').addEventListener('input', saveDraft);

function copyText(text){
  navigator.clipboard.writeText(text);
}

async function generateWithAI(){
  const category = document.getElementById('category').value;
  const tone = document.getElementById('tone').value;
  const brand = document.getElementById('brand').value.trim();
  const includeKeywords = document.getElementById('includeKeywords').value.trim();
  const excludeKeywords = document.getElementById('excludeKeywords').value.trim();
  const markets = getSelectedMarkets();
  const statusEl = document.getElementById('genStatus');
  const btn = document.getElementById('aiGenBtn');
  const countSelect = document.getElementById('aiGenCount');
  const count = parseInt(countSelect.value, 10) || 1;

  const descEls = [document.getElementById('input'), ...document.querySelectorAll('.extra-desc')].slice(0, count);
  const inputs = descEls.map(el => el.value.trim());

  if(inputs.some(v => !v)){
    statusEl.textContent = '상품 설명을 모두 입력해주세요.';
    statusEl.className = 'status err';
    return;
  }
  if(markets.length === 0){
    statusEl.textContent = '판매처를 최소 1개 선택해주세요.';
    statusEl.className = 'status err';
    return;
  }

  btn.disabled = true;
  countSelect.disabled = true;

  document.getElementById('aiResultsContainer').innerHTML = '';
  document.getElementById('aiResultCard').style.display = 'block';
  document.getElementById('aiResultStatus').textContent = '';
  currentResults = [];

  for(let i = 0; i < count; i++){
    statusEl.textContent = count > 1
      ? `AI가 만드는 중... (${i + 1}/${count})`
      : 'AI가 만드는 중... (몇 초 걸려요)';
    statusEl.className = 'status';

    const { data, error } = await sb.functions.invoke('generate-listing', {
      body: { input: inputs[i], category, tone, brand, markets, includeKeywords, excludeKeywords }
    });

    if(error || !data || data.error){
      statusEl.textContent = data?.error || ('AI 생성 실패: ' + (await getInvokeErrorMessage(error)));
      statusEl.className = 'status err';
      break;
    }

    if(!aiIsPro && typeof data.remaining === 'number'){
      aiRemaining = data.remaining;
    }
    const meta = { input: inputs[i], category, tone, brand };
    renderAiResult(data.result, i, count, meta);
    currentResults.push({ text: data.result, index: i, total: count, meta });
    saveDraft();

    if(i === count - 1){
      statusEl.textContent = '';
    }
  }

  updateAiGenControls();
}

function parseAiResult(text){
  const headerDefs = [
    { key: 'name', re: /^상품명\s*$/m },
    { key: 'smartstore', re: /^스마트스토어\s*검색태그[^\n]*$/m },
    { key: 'coupang', re: /^쿠팡\s*검색어[^\n]*$/m },
    { key: 'desc', re: /^상품소개글\s*$/m },
  ];

  const found = [];
  headerDefs.forEach(def => {
    const m = def.re.exec(text);
    if(m) found.push({ key: def.key, start: m.index, headerEnd: m.index + m[0].length });
  });
  found.sort((a, b) => a.start - b.start);

  const sections = {};
  found.forEach((f, i) => {
    const end = i + 1 < found.length ? found[i + 1].start : text.length;
    sections[f.key] = text.slice(f.headerEnd, end).trim();
  });

  const names = sections.name
    ? Array.from(sections.name.matchAll(/^\s*\d+\)\s*(.+)$/gm)).map(m => m[1].trim())
    : [];

  return {
    names,
    smartstore: sections.smartstore ? sections.smartstore.replace(/\s*\n\s*/g, ' ').trim() : '',
    coupang: sections.coupang ? sections.coupang.replace(/\s*\n\s*/g, ' ').trim() : '',
    desc: sections.desc || '',
  };
}

function buildCopyField(labelText, value, tag){
  const block = document.createElement('div');
  block.className = 'field-block';

  const label = document.createElement('label');
  label.textContent = labelText;
  block.appendChild(label);

  const field = document.createElement(tag);
  if(tag === 'input') field.type = 'text';
  else field.style.minHeight = '80px';
  field.value = value;
  block.appendChild(field);

  const copyBtn = document.createElement('button');
  copyBtn.type = 'button';
  copyBtn.className = 'mini-btn';
  copyBtn.style.marginTop = '6px';
  copyBtn.textContent = '복사하기';
  copyBtn.onclick = function(){
    copyText(field.value);
    copyBtn.textContent = '복사됐어요!';
    setTimeout(() => { copyBtn.textContent = '복사하기'; }, 1500);
  };
  block.appendChild(copyBtn);

  return block;
}

function renderAiResult(text, index, total, meta){
  const container = document.getElementById('aiResultsContainer');
  const block = document.createElement('div');
  block.style.marginBottom = '16px';

  if(total > 1){
    const label = document.createElement('div');
    label.className = 'hint';
    label.style.marginTop = '0';
    label.textContent = `상품 ${index + 1} 결과`;
    block.appendChild(label);
  }

  const textarea = document.createElement('textarea');
  textarea.className = 'promptOut ai-result-textarea';
  textarea.readOnly = true;
  textarea.value = text;
  block.appendChild(textarea);

  const copyBtn = document.createElement('button');
  copyBtn.className = 'primary';
  copyBtn.style.marginTop = '8px';
  copyBtn.textContent = '복사하기';
  copyBtn.onclick = function(){
    copyText(textarea.value);
    copyBtn.textContent = '복사됐어요!';
    setTimeout(() => { copyBtn.textContent = '복사하기'; }, 1500);
  };
  block.appendChild(copyBtn);

  const parsed = parseAiResult(text);
  if(parsed.names.length || parsed.smartstore || parsed.coupang || parsed.desc){
    const splitWrap = document.createElement('div');
    splitWrap.style.cssText = 'margin-top:14px; padding-top:14px; border-top:1px dashed var(--line);';

    const splitHint = document.createElement('div');
    splitHint.className = 'hint';
    splitHint.style.marginTop = '0';
    splitHint.textContent = '항목별로 나눠서 수정하고 따로 복사할 수 있어요';
    splitWrap.appendChild(splitHint);

    parsed.names.forEach((name, i) => {
      splitWrap.appendChild(buildCopyField(`상품명 ${i + 1}`, name, 'input'));
    });
    if(parsed.smartstore){
      splitWrap.appendChild(buildCopyField('스마트스토어 검색태그', parsed.smartstore, 'textarea'));
    }
    if(parsed.coupang){
      splitWrap.appendChild(buildCopyField('쿠팡 검색어', parsed.coupang, 'textarea'));
    }
    if(parsed.desc){
      splitWrap.appendChild(buildCopyField('상품소개글', parsed.desc, 'textarea'));
    }
    block.appendChild(splitWrap);
  }

  const saveBtn = document.createElement('button');
  saveBtn.className = 'secondary';
  saveBtn.textContent = '내 계정에 저장하기';
  saveBtn.onclick = function(){
    saveAiResultToHistory(text, meta, saveBtn);
  };
  block.appendChild(saveBtn);

  container.appendChild(block);
}

async function saveAiResultToHistory(text, meta, btn){
  if(!currentUser) return;
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = '저장 중...';

  const { error } = await sb.from('product_prompts').insert({
    user_id: currentUser.id,
    input_text: meta.input,
    category: meta.category,
    tone: meta.tone,
    brand: meta.brand,
    prompt_text: text
  });

  btn.textContent = error ? '저장 실패' : '저장됐어요!';
  setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 1500);
}
</script>
