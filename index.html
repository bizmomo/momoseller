<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모모셀러</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #F1EFE6;
    --card: #FFFEFA;
    --ink: #23281F;
    --ink-soft: #6B6F60;
    --accent: #B9860E;
    --accent-deep: #8C660A;
    --teal: #2F6F63;
    --teal-soft: #E3EFEA;
    --line: #DCD6C2;
    --error: #A6432F;
  }
  * { box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans KR', system-ui, sans-serif;
    padding: 28px 14px 80px;
  }
  .wrap{ max-width: 640px; margin: 0 auto; }
  .masthead{ margin-bottom: 20px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .masthead h1{ font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 24px; margin: 0 0 6px; }
  .masthead p{ margin: 0; color: var(--ink-soft); font-size: 13.5px; line-height: 1.6; }

  .user-chip{ font-size: 12.5px; color: var(--ink-soft); white-space: nowrap; text-align:right; }
  .user-chip button{
    display:block; margin-top:4px; border:1px solid var(--line); background:#fff; color:var(--ink-soft);
    font-size:12px; padding:4px 10px; border-radius:3px; cursor:pointer;
  }

  .card{
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 26px 20px;
    margin-bottom: 16px;
    box-shadow: 0 1px 0 var(--line);
  }
  .card h2{ font-family: 'Noto Serif KR', serif; font-size: 16px; margin: 0 0 12px; }

  label{ display:block; font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
  input[type=email], input[type=password], input[type=text], select, textarea{
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 10px 12px;
  }
  .field-block{ margin-bottom: 14px; }
  .row{ display:flex; gap: 10px; }
  .row > div{ flex:1; }

  button.primary{
    width: 100%;
    background: var(--ink);
    color: #FBF9F2;
    border: none;
    border-radius: 3px;
    padding: 13px 16px;
    font-size: 15px;
    font-weight: 500;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
  }
  button.primary:disabled{ background: #9C9A8E; cursor: not-allowed; }
  button.primary:hover:not(:disabled){ background: #3A4030; }
  button.secondary{
    width: 100%;
    background: #fff;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 10px 16px;
    font-size: 13.5px;
    cursor: pointer;
    margin-top: 8px;
  }
  button.secondary:hover{ border-color: var(--accent); color: var(--accent-deep); }

  .status{ margin-top: 10px; font-size: 13px; color: var(--ink-soft); min-height: 18px; }
  .status.err{ color: var(--error); }
  .status.ok{ color: var(--teal); }

  .tabs{ display:flex; gap:6px; margin-bottom:16px; }
  .tab-btn{
    flex:1; text-align:center; padding:9px 10px; font-size:13.5px;
    border:1px solid var(--line); background:#fff; color:var(--ink-soft); border-radius:3px; cursor:pointer;
  }
  .tab-btn.active{ background:var(--ink); color:#FBF9F2; border-color:var(--ink); }

  #authView{ display:block; }
  #appView{ display:none; }
  #authSignin{ display:block; }
  #authSignup{ display:none; }

  .switch-link{ font-size:12.5px; color:var(--accent-deep); text-align:center; margin-top:12px; cursor:pointer; text-decoration:underline; }

  .promptOut{
    width:100%; min-height:180px; font-size:13px; line-height:1.6;
    background:#FAF8F1; border:1px solid var(--line); border-radius:3px; padding:12px;
  }
  .hint{ font-size:12px; color:var(--ink-soft); margin-top:6px; line-height:1.6; }

  .tool-link{
    display:block; text-align:center; font-size:13px; color:var(--accent-deep); text-decoration:none;
    border:1px solid var(--line); border-radius:3px; padding:11px 12px; background:#fff; margin-bottom:16px;
  }
  .tool-link:hover{ border-color:var(--accent); }

  .history-item{
    border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; margin-bottom: 10px; background:#fff;
  }
  .history-item .hi-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .history-item .hi-date{ font-size:11.5px; color:var(--ink-soft); }
  .history-item .hi-input{ font-size:13.5px; line-height:1.5; margin-bottom:8px; }
  .history-item .hi-actions{ display:flex; gap:8px; }
  .mini-btn{
    border:1px solid var(--line); background:#fff; color:var(--ink-soft); font-size:12px;
    padding:5px 10px; border-radius:3px; cursor:pointer;
  }
  .mini-btn:hover{ border-color:var(--accent); color:var(--accent-deep); }
  .mini-btn.danger:hover{ border-color:var(--error); color:var(--error); }
  .empty-note{ font-size:13px; color:var(--ink-soft); text-align:center; padding:20px 0; }

  .foot-note{ margin-top: 20px; font-size: 12px; color: var(--ink-soft); line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div>
      <h1>모모셀러</h1>
      <p>로그인하면 만든 프롬프트가 내 계정에 저장돼요.</p>
    </div>
    <div class="user-chip" id="userChip" style="display:none;">
      <span id="userEmail"></span>
      <button onclick="signOut()">로그아웃</button>
    </div>
  </div>

  <!-- 로그인 화면 -->
  <div id="authView">
    <div class="card">
      <div id="authSignin">
        <h2>로그인</h2>
        <div class="field-block">
          <label for="siEmail">이메일</label>
          <input type="email" id="siEmail" placeholder="you@example.com">
        </div>
        <div class="field-block">
          <label for="siPassword">비밀번호</label>
          <input type="password" id="siPassword" placeholder="비밀번호">
        </div>
        <button class="primary" onclick="signIn()">로그인</button>
        <div class="status" id="siStatus"></div>
        <div class="switch-link" onclick="showSignup()">계정이 없으신가요? 회원가입</div>
      </div>

      <div id="authSignup">
        <h2>회원가입</h2>
        <div class="field-block">
          <label for="suEmail">이메일</label>
          <input type="email" id="suEmail" placeholder="you@example.com">
        </div>
        <div class="field-block">
          <label for="suPassword">비밀번호 (6자 이상)</label>
          <input type="password" id="suPassword" placeholder="비밀번호">
        </div>
        <button class="primary" onclick="signUp()">회원가입</button>
        <div class="status" id="suStatus"></div>
        <div class="switch-link" onclick="showSignin()">이미 계정이 있으신가요? 로그인</div>
      </div>
    </div>
  </div>

  <!-- 로그인 후 화면 -->
  <div id="appView">
    <div class="tabs">
      <div class="tab-btn active" id="tabGenBtn" onclick="setTab('gen')">프롬프트 만들기</div>
      <div class="tab-btn" id="tabHistBtn" onclick="setTab('hist')">저장된 기록</div>
    </div>

    <div id="genTab">
      <div class="card">
        <h2>상품 정보</h2>
        <div class="row" style="margin-bottom:14px;">
          <div>
            <label for="category">카테고리</label>
            <select id="category">
              <option value="">선택 안 함</option>
              <option value="패션/의류">패션/의류</option>
              <option value="뷰티">뷰티</option>
              <option value="식품">식품</option>
              <option value="생활/잡화">생활/잡화</option>
              <option value="전자기기">전자기기</option>
              <option value="유아동">유아동</option>
              <option value="반려동물">반려동물</option>
              <option value="기타">기타</option>
            </select>
          </div>
          <div>
            <label for="tone">톤</label>
            <select id="tone">
              <option value="친근하고 신뢰감 있게">친근하게</option>
              <option value="전문적이고 신뢰감 있게">전문적으로</option>
              <option value="트렌디하고 감각적으로">트렌디하게</option>
              <option value="가성비를 강조하며 실속있게">가성비 강조</option>
            </select>
          </div>
        </div>
        <div class="field-block">
          <label for="brand">브랜드명 (없으면 비워두세요)</label>
          <input type="text" id="brand" placeholder="예) JAJU">
        </div>
        <div class="field-block">
          <label for="input">상품 설명 (대충 적어도 돼요)</label>
          <textarea id="input" style="min-height:84px;" placeholder="예) 겨울에 입는 두꺼운 기모 후드티, 남녀공용, 색은 검정 회색 베이지 3가지, 원단 도톰함"></textarea>
        </div>
        <button class="primary" onclick="generatePrompt()">프롬프트 만들기</button>
        <div class="status" id="genStatus"></div>
      </div>

      <div class="card" id="resultCard" style="display:none;">
        <h2>Claude로 보낼 내용 (수정 가능)</h2>
        <textarea class="promptOut" id="promptOut"></textarea>
        <div class="hint">내용을 여기서 바로 고칠 수 있어요.</div>
        <button class="primary" style="margin-top:10px;" onclick="copyPrompt()">복사하기</button>
        <button class="secondary" onclick="openInClaude()">Claude에서 열기</button>
        <button class="secondary" onclick="saveToHistory()">내 계정에 저장하기</button>
        <div class="status" id="saveStatus"></div>
      </div>
    </div>

    <div id="histTab" style="display:none;">
      <div class="card">
        <h2>저장된 기록</h2>
        <div id="historyList"><div class="empty-note">불러오는 중...</div></div>
      </div>
    </div>

    <a href="settlement.html" class="tool-link">📊 정산 정리 도구 열기 — 쿠팡·스마트스토어 엑셀로 정산 요약 만들기 (새 페이지)</a>

    <div class="foot-note">저장된 기록은 로그인한 계정에만 보여요. 다른 사람과 공유되지 않아요.</div>
  </div>

</div>

<script>
const SUPABASE_URL = 'https://aangpllxztgyoflioqai.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ay-HMiHrtPqZpYEfzsXFAA_AOgVwOT_';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let currentTab = 'gen';

async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if(session){
    onLoggedIn(session.user);
  }
  sb.auth.onAuthStateChange((event, session) => {
    if(event === 'SIGNED_IN' && session){
      onLoggedIn(session.user);
    } else if(event === 'SIGNED_OUT'){
      onLoggedOut();
    }
  });
}
init();

function onLoggedIn(user){
  currentUser = user;
  document.getElementById('authView').style.display = 'none';
  document.getElementById('appView').style.display = 'block';
  document.getElementById('userChip').style.display = 'block';
  document.getElementById('userEmail').textContent = user.email;
  loadHistory();
}

function onLoggedOut(){
  currentUser = null;
  document.getElementById('authView').style.display = 'block';
  document.getElementById('appView').style.display = 'none';
  document.getElementById('userChip').style.display = 'none';
}

function showSignup(){
  document.getElementById('authSignin').style.display = 'none';
  document.getElementById('authSignup').style.display = 'block';
}
function showSignin(){
  document.getElementById('authSignup').style.display = 'none';
  document.getElementById('authSignin').style.display = 'block';
}

async function signUp(){
  const email = document.getElementById('suEmail').value.trim();
  const password = document.getElementById('suPassword').value;
  const statusEl = document.getElementById('suStatus');
  if(!email || !password){
    statusEl.textContent = '이메일과 비밀번호를 입력해주세요.';
    statusEl.className = 'status err';
    return;
  }
  statusEl.textContent = '가입 중...';
  statusEl.className = 'status';
  const { data, error } = await sb.auth.signUp({ email, password });
  if(error){
    statusEl.textContent = error.message;
    statusEl.className = 'status err';
    return;
  }
  if(data.session){
    statusEl.textContent = '';
    onLoggedIn(data.user);
  } else {
    statusEl.textContent = '가입 완료! 이메일함에서 인증 링크를 확인해주세요.';
    statusEl.className = 'status ok';
  }
}

async function signIn(){
  const email = document.getElementById('siEmail').value.trim();
  const password = document.getElementById('siPassword').value;
  const statusEl = document.getElementById('siStatus');
  if(!email || !password){
    statusEl.textContent = '이메일과 비밀번호를 입력해주세요.';
    statusEl.className = 'status err';
    return;
  }
  statusEl.textContent = '로그인 중...';
  statusEl.className = 'status';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){
    statusEl.textContent = '로그인 실패: ' + error.message;
    statusEl.className = 'status err';
    return;
  }
  statusEl.textContent = '';
}

async function signOut(){
  await sb.auth.signOut();
}

function setTab(tab){
  currentTab = tab;
  document.getElementById('tabGenBtn').classList.toggle('active', tab === 'gen');
  document.getElementById('tabHistBtn').classList.toggle('active', tab === 'hist');
  document.getElementById('genTab').style.display = tab === 'gen' ? 'block' : 'none';
  document.getElementById('histTab').style.display = tab === 'hist' ? 'block' : 'none';
  if(tab === 'hist') loadHistory();
}

const RULES_TEXT = `[상품명 규칙]
1) 특수문자(★☆♥ 등)와 이모지를 쓰지 않는다.
2) 같은 뜻의 단어를 반복하지 않는다(예: '원피스 ... 원피스'처럼 유의어 중복 금지).
3) 특정 브랜드를 모방/암시하는 표현('OO스타일', '이미테이션' 등)을 쓰지 않는다.
4) 10대/20대/30대처럼 특정 연령대를 못박는 타겟 키워드를 쓰지 않는다.
5) '신상품', '주문폭주', '특가', '할인', '무료배송', '이벤트' 같은 홍보성 키워드를 쓰지 않는다.
6) 렌탈/해외/중고 여부는 기입하지 않는다.
7) 구성은 [브랜드명(있으면) + 소재/특징 속성 + 카테고리명 + 사이즈(해당시) + 시즌성/용도(해당시)] 순서로 간결하게, 25자 내외로 3개를 서로 다른 각도(속성 강조/카테고리 강조/용도 강조)로 만든다.

[스마트스토어 검색태그 규칙]
10개, # 기호 없이 순수 단어/구문으로, 상품명에 이미 쓴 단어·카테고리명·브랜드명과 겹치지 않는 새로운 검색 키워드(용도, 상황, 소재, 특징, 관련 검색어)로만 채운다. '할인/무료배송/특가/이벤트' 같은 홍보 문구는 쓰지 않는다.

[쿠팡 검색어 규칙]
20개, 스마트스토어 태그 10개와 최대한 겹치지 않게 다른 표현·동의어·연관 키워드까지 넓혀서 채운다(쿠팡은 검색어 허용 폭이 더 넓음). 마찬가지로 상품명과 겹치지 않게 하고, 홍보 문구는 쓰지 않는다.

[상품소개글]
3~5문장, 과장 없이 구체적인 특징 위주로, 한 문단으로 쓴다.`;

function buildPrompt(input, category, tone, brand){
  return `너는 네이버 스마트스토어와 쿠팡 상품 등록을 동시에 돕는 카피라이터야. 아래 상품 정보로 상품명 3개, 스마트스토어 검색태그 10개, 쿠팡 검색어 20개, 상품소개글 1개를 만들어줘.

${RULES_TEXT}

[상품 정보]
브랜드명: ${brand || "없음"}
카테고리: ${category || "미지정"}
원하는 톤: ${tone}
상품 설명: ${input}

아래 형식 그대로 보기 좋게 정리해서 답변해줘:

상품명
1)
2)
3)

스마트스토어 검색태그 (쉼표로 구분)

쿠팡 검색어 (쉼표로 구분)

상품소개글
`;
}

let lastInput = { input:'', category:'', tone:'', brand:'', prompt:'' };

function generatePrompt(){
  const input = document.getElementById('input').value.trim();
  const category = document.getElementById('category').value;
  const tone = document.getElementById('tone').value;
  const brand = document.getElementById('brand').value.trim();
  const statusEl = document.getElementById('genStatus');

  if(!input){
    statusEl.textContent = '상품 설명을 먼저 적어주세요.';
    statusEl.className = 'status err';
    return;
  }

  const prompt = buildPrompt(input, category, tone, brand);
  document.getElementById('promptOut').value = prompt;
  document.getElementById('resultCard').style.display = 'block';
  document.getElementById('saveStatus').textContent = '';
  statusEl.textContent = '';

  lastInput = { input, category, tone, brand, prompt };
}

function copyText(text){
  navigator.clipboard.writeText(text);
}

function copyPrompt(){
  copyText(document.getElementById('promptOut').value);
  const statusEl = document.getElementById('saveStatus');
  statusEl.textContent = '복사됐어요.';
  statusEl.className = 'status ok';
}

function openInClaude(){
  const text = document.getElementById('promptOut').value;
  copyText(text);
  window.open('https://claude.ai/new?q=' + encodeURIComponent(text), '_blank');
}

async function saveToHistory(){
  if(!currentUser) return;
  const statusEl = document.getElementById('saveStatus');
  const promptText = document.getElementById('promptOut').value;
  statusEl.textContent = '저장 중...';
  statusEl.className = 'status';

  const { error } = await sb.from('product_prompts').insert({
    user_id: currentUser.id,
    input_text: lastInput.input,
    category: lastInput.category,
    tone: lastInput.tone,
    brand: lastInput.brand,
    prompt_text: promptText
  });

  if(error){
    statusEl.textContent = '저장 실패: ' + error.message;
    statusEl.className = 'status err';
    return;
  }
  statusEl.textContent = '저장됐어요.';
  statusEl.className = 'status ok';
}

async function loadHistory(){
  if(!currentUser) return;
  const listEl = document.getElementById('historyList');
  listEl.innerHTML = '<div class="empty-note">불러오는 중...</div>';

  const { data, error } = await sb
    .from('product_prompts')
    .select('*')
    .order('created_at', { ascending: false })
    .limit(50);

  if(error){
    listEl.innerHTML = `<div class="empty-note">불러오기 실패: ${escapeHtml(error.message)}</div>`;
    return;
  }

  if(!data || data.length === 0){
    listEl.innerHTML = '<div class="empty-note">아직 저장된 기록이 없어요.</div>';
    return;
  }

  listEl.innerHTML = '';
  data.forEach(row => {
    const div = document.createElement('div');
    div.className = 'history-item';
    const date = new Date(row.created_at);
    const dateStr = `${date.getFullYear()}.${String(date.getMonth()+1).padStart(2,'0')}.${String(date.getDate()).padStart(2,'0')} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
    div.innerHTML = `
      <div class="hi-top">
        <span class="hi-date">${dateStr}</span>
      </div>
      <div class="hi-input">${escapeHtml(row.input_text)}</div>
      <div class="hi-actions">
        <button class="mini-btn" onclick="viewHistoryItem('${row.id}')">불러오기</button>
        <button class="mini-btn danger" onclick="deleteHistoryItem('${row.id}')">삭제</button>
      </div>
    `;
    listEl.appendChild(div);
  });

  window._historyCache = data;
}

function viewHistoryItem(id){
  const row = (window._historyCache || []).find(r => r.id === id);
  if(!row) return;
  document.getElementById('input').value = row.input_text || '';
  document.getElementById('category').value = row.category || '';
  document.getElementById('tone').value = row.tone || '친근하고 신뢰감 있게';
  document.getElementById('brand').value = row.brand || '';
  document.getElementById('promptOut').value = row.prompt_text || '';
  document.getElementById('resultCard').style.display = 'block';
  setTab('gen');
}

async function deleteHistoryItem(id){
  const { error } = await sb.from('product_prompts').delete().eq('id', id);
  if(!error){
    loadHistory();
  }
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
