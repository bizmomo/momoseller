<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>계정 정보 | 모모셀러</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link href="shared.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div>
      <h1>계정 정보</h1>
      <p>이메일 확인, 비밀번호 변경, 로그아웃을 할 수 있어요.</p>
    </div>
  </div>

  <p style="margin:-10px 0 20px;"><a href="my.html" style="font-size:12.5px; color:var(--accent-deep); text-decoration:underline;">← 마이페이지로</a></p>

  <div class="card">
    <div class="field-block">
      <label>이메일</label>
      <div id="myEmail" style="font-size:14px;"></div>
    </div>
    <div class="field-block">
      <label>새 비밀번호 (6자 이상)</label>
      <input type="password" id="newPassword" placeholder="새 비밀번호">
    </div>
    <button class="secondary" onclick="changePassword()">비밀번호 변경</button>
    <div class="status" id="passwordStatus"></div>
  </div>

  <div class="switch-link" onclick="signOut()" style="margin-top:20px;">로그아웃</div>

</div>

<nav class="bottom-nav"><div class="bottom-nav-inner">
  <a href="home.html" class="nav-item"><span class="nav-icon">🏠</span><span>홈</span></a>
  <a href="index.html" class="nav-item"><span class="nav-icon">✍️</span><span>상품등록</span></a>
  <a href="settlement.html" class="nav-item"><span class="nav-icon">📊</span><span>정산</span></a>
  <a href="analysis.html" class="nav-item"><span class="nav-icon">📈</span><span>분석</span></a>
  <a href="my.html" class="nav-item"><span class="nav-icon">👤</span><span>마이</span></a>
</div></nav>

<script>
let currentUser = null;

requireAuth(function(user){
  currentUser = user;
  document.getElementById('myEmail').textContent = user.email;
});

async function changePassword(){
  const newPassword = document.getElementById('newPassword').value;
  const statusEl = document.getElementById('passwordStatus');

  if(!newPassword || newPassword.length < 6){
    statusEl.textContent = '6자 이상 입력해주세요.';
    statusEl.className = 'status err';
    return;
  }

  statusEl.textContent = '변경 중...';
  statusEl.className = 'status';

  const { error } = await sb.auth.updateUser({ password: newPassword });

  if(error){
    statusEl.textContent = '변경 실패: ' + error.message;
    statusEl.className = 'status err';
    return;
  }

  statusEl.textContent = '비밀번호가 변경됐어요.';
  statusEl.className = 'status ok';
  document.getElementById('newPassword').value = '';
}
</script>
</body>
</html>
