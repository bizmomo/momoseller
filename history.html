<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>저장된 기록 | 모모셀러</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link href="shared.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div>
      <h1>저장된 기록</h1>
      <p>로그인한 계정에만 보여요. 다른 사람과 공유되지 않아요.</p>
    </div>
    <div class="page-actions">
      <button class="icon-btn" onclick="goBack()" aria-label="뒤로가기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
      <button class="icon-btn" onclick="sharePage()" aria-label="공유하기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg></button>
    </div>
  </div>

  <div class="card">
    <h2>저장된 기록</h2>
    <div id="historyList"><div class="empty-note">불러오는 중...</div></div>
  </div>

</div>

<nav class="bottom-nav"><div class="bottom-nav-inner">
  <a href="home.html" class="nav-item"><span class="nav-icon">🏠</span><span>홈</span></a>
  <a href="index.html" class="nav-item"><span class="nav-icon">✍️</span><span>상품등록</span></a>
  <a href="settlement.html" class="nav-item"><span class="nav-icon">📊</span><span>정산</span></a>
  <a href="analysis.html" class="nav-item"><span class="nav-icon">📈</span><span>분석</span></a>
  <a href="my.html" class="nav-item"><span class="nav-icon">👤</span><span>마이</span></a>
</div></nav>

<script>
requireAuth(function(){
  loadHistory();
});

async function loadHistory(){
  const listEl = document.getElementById('historyList');
  listEl.innerHTML = '<div class="empty-note">불러오는 중...</div>';

  const { data, error } = await sb
    .from('product_prompts')
    .select('*')
    .order('created_at', { ascending: false })
    .limit(50);

  if(error){
    listEl.innerHTML = `<div class="empty-note">불러오기 실패: ${escapeHtml(error.message)}</div>`;
    return;
  }

  if(!data || data.length === 0){
    listEl.innerHTML = '<div class="empty-note">아직 저장된 기록이 없어요.</div>';
    return;
  }

  listEl.innerHTML = '';
  data.forEach(row => {
    const div = document.createElement('div');
    div.className = 'history-item';
    const date = new Date(row.created_at);
    const dateStr = `${date.getFullYear()}.${String(date.getMonth()+1).padStart(2,'0')}.${String(date.getDate()).padStart(2,'0')} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
    div.innerHTML = `
      <div class="hi-top">
        <span class="hi-date">${dateStr}</span>
      </div>
      <div class="hi-input">${escapeHtml(row.input_text)}</div>
      <div class="hi-actions">
        <button class="mini-btn" onclick="toggleHistoryResult('${row.id}')">결과 보기</button>
        <button class="mini-btn danger" onclick="deleteHistoryItem('${row.id}')">삭제</button>
      </div>
      <div class="hi-result" id="hiResult-${row.id}" style="display:none;">
        <textarea class="promptOut" style="min-height:220px; margin-top:10px;" id="hiTextarea-${row.id}">${escapeHtml(row.prompt_text)}</textarea>
        <div class="hi-actions" style="margin-top:8px;">
          <button class="mini-btn" onclick="copyHistoryResult('${row.id}', this)">복사하기</button>
          <button class="mini-btn" onclick="saveHistoryEdit('${row.id}', this)">수정 내용 저장</button>
        </div>
        <div class="hint" id="hiEditStatus-${row.id}" style="margin-top:6px; min-height:0;"></div>
      </div>
    `;
    listEl.appendChild(div);
  });

  window._historyCache = data;
}

function toggleHistoryResult(id){
  const el = document.getElementById('hiResult-' + id);
  if(!el) return;
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function copyHistoryResult(id, btn){
  const textarea = document.getElementById('hiTextarea-' + id);
  if(!textarea) return;
  navigator.clipboard.writeText(textarea.value || '');
  const original = btn.textContent;
  btn.textContent = '복사됐어요!';
  setTimeout(() => { btn.textContent = original; }, 1500);
}

async function saveHistoryEdit(id, btn){
  const textarea = document.getElementById('hiTextarea-' + id);
  const statusEl = document.getElementById('hiEditStatus-' + id);
  if(!textarea) return;

  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = '저장 중...';

  const { error } = await sb.from('product_prompts').update({ prompt_text: textarea.value }).eq('id', id);

  btn.disabled = false;
  btn.textContent = original;

  if(statusEl){
    statusEl.textContent = error ? '수정 저장에 실패했어요.' : '✓ 수정한 내용이 저장됐어요.';
    statusEl.style.color = error ? 'var(--error)' : 'var(--teal)';
    setTimeout(() => { statusEl.textContent = ''; }, 2000);
  }

  if(!error){
    const row = (window._historyCache || []).find(r => r.id === id);
    if(row) row.prompt_text = textarea.value;
  }
}

async function deleteHistoryItem(id){
  const { error } = await sb.from('product_prompts').delete().eq('id', id);
  if(!error){
    loadHistory();
  }
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
