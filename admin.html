<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>충전 관리 | 모모셀러</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link href="shared.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div>
      <h1>충전 관리</h1>
      <p>운영자 전용 페이지예요. 다른 계정에는 보이지 않아요.</p>
    </div>
    <div class="page-actions">
      <button class="icon-btn" onclick="goBack()" aria-label="뒤로가기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
      <button class="icon-btn" onclick="sharePage()" aria-label="공유하기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg></button>
    </div>
  </div>

  <p style="margin:-10px 0 20px;"><a href="my.html" style="font-size:12.5px; color:var(--accent-deep); text-decoration:underline;">← 마이페이지로</a></p>

  <div id="deniedNote" class="card" style="display:none;">
    <div class="empty-note">관리자만 접근할 수 있는 페이지예요.</div>
  </div>

  <div id="adminCard" class="card" style="display:none;">
    <h2>사용자 충전하기</h2>
    <p class="hint" style="margin-top:-6px; margin-bottom:16px;">결제 확인 후 이메일과 충전할 횟수를 입력하면, 그 계정의 AI 생성 가능 횟수가 즉시 늘어나요.</p>
    <div class="field-block">
      <label>사용자 이메일</label>
      <input type="email" id="targetEmail" placeholder="customer@example.com">
    </div>
    <div class="field-block">
      <label>충전할 생성 횟수</label>
      <input type="number" id="chargeAmount" value="10" min="1">
    </div>
    <button class="primary" onclick="chargeUser()">충전하기</button>
    <div class="status" id="chargeStatus"></div>
  </div>

  <div id="chargeRequestsCard" class="card" style="display:none;">
    <h2>충전 요청 목록</h2>
    <p class="hint" style="margin-top:-6px; margin-bottom:14px;">사용자가 입금 완료 후 접수한 요청이에요. 계좌에 입금이 확인되면 위 폼으로 충전해주고, 처리했으면 삭제해주세요.</p>
    <div id="chargeRequestsList"><div class="empty-note">불러오는 중...</div></div>
  </div>

</div>

<script>
let currentUser = null;

requireAuth(function(user){
  currentUser = user;
  checkAdminAccess();
});

async function checkAdminAccess(){
  const { data } = await sb.from('profiles').select('is_admin').eq('id', currentUser.id).single();
  if(!data || !data.is_admin){
    document.getElementById('deniedNote').style.display = 'block';
    return;
  }
  document.getElementById('adminCard').style.display = 'block';
  document.getElementById('chargeRequestsCard').style.display = 'block';
  loadChargeRequests();
}

async function loadChargeRequests(){
  const listEl = document.getElementById('chargeRequestsList');
  listEl.innerHTML = '<div class="empty-note">불러오는 중...</div>';

  const { data, error } = await sb
    .from('charge_requests')
    .select('*')
    .order('created_at', { ascending: false });

  if(error){
    listEl.innerHTML = `<div class="empty-note">불러오기 실패: ${escapeHtml(error.message)}</div>`;
    return;
  }

  if(!data || data.length === 0){
    listEl.innerHTML = '<div class="empty-note">대기 중인 충전 요청이 없어요.</div>';
    return;
  }

  listEl.innerHTML = '';
  data.forEach(req => {
    const date = new Date(req.created_at);
    const dateStr = `${date.getFullYear()}.${String(date.getMonth()+1).padStart(2,'0')}.${String(date.getDate()).padStart(2,'0')} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;

    const div = document.createElement('div');
    div.className = 'history-item';

    const top = document.createElement('div');
    top.className = 'hi-top';
    const dateSpan = document.createElement('span');
    dateSpan.className = 'hi-date';
    dateSpan.textContent = dateStr;
    top.appendChild(dateSpan);
    div.appendChild(top);

    const info = document.createElement('div');
    info.className = 'hi-input';
    info.textContent = `${req.email} — ${req.credits}개 (${req.price_won.toLocaleString('ko-KR')}원)`;
    div.appendChild(info);

    const actions = document.createElement('div');
    actions.className = 'hi-actions';

    const fillBtn = document.createElement('button');
    fillBtn.className = 'mini-btn';
    fillBtn.textContent = '충전 폼에 입력';
    fillBtn.onclick = () => {
      document.getElementById('targetEmail').value = req.email;
      document.getElementById('chargeAmount').value = req.credits;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    actions.appendChild(fillBtn);

    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'mini-btn danger';
    deleteBtn.textContent = '삭제';
    deleteBtn.onclick = async () => {
      await sb.from('charge_requests').delete().eq('id', req.id);
      loadChargeRequests();
    };
    actions.appendChild(deleteBtn);

    div.appendChild(actions);
    listEl.appendChild(div);
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function chargeUser(){
  const email = document.getElementById('targetEmail').value.trim();
  const amount = parseInt(document.getElementById('chargeAmount').value, 10);
  const statusEl = document.getElementById('chargeStatus');

  if(!email){
    statusEl.textContent = '이메일을 입력해주세요.';
    statusEl.className = 'status err';
    return;
  }
  if(!amount || amount < 1){
    statusEl.textContent = '1 이상의 숫자를 입력해주세요.';
    statusEl.className = 'status err';
    return;
  }

  statusEl.textContent = '조회 중...';
  statusEl.className = 'status';

  const { data: target, error: findError } = await sb
    .from('profiles')
    .select('id, email, ai_generations_used, ai_generations_limit')
    .eq('email', email)
    .maybeSingle();

  if(findError || !target){
    statusEl.textContent = '해당 이메일의 사용자를 찾을 수 없어요.';
    statusEl.className = 'status err';
    return;
  }

  const newLimit = (target.ai_generations_limit || 0) + amount;
  const { error: updateError } = await sb
    .from('profiles')
    .update({ ai_generations_limit: newLimit })
    .eq('id', target.id);

  if(updateError){
    statusEl.textContent = '충전 실패: ' + updateError.message;
    statusEl.className = 'status err';
    return;
  }

  statusEl.textContent = `충전 완료! ${email} 님의 한도가 ${newLimit}회로 늘었어요. (지금까지 사용: ${target.ai_generations_used}회)`;
  statusEl.className = 'status ok';
  document.getElementById('targetEmail').value = '';
}
</script>
</body>
</html>
