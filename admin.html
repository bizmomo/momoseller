<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>충전 관리 | 모모셀러</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link href="shared.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div>
      <h1>충전 관리</h1>
      <p>운영자 전용 페이지예요. 다른 계정에는 보이지 않아요.</p>
    </div>
    <div class="user-chip" id="userChip" style="display:none;">
      <span id="userEmail"></span>
      <button onclick="signOut()">로그아웃</button>
    </div>
  </div>

  <p style="margin:-10px 0 20px;"><a href="my.html" style="font-size:12.5px; color:var(--accent-deep); text-decoration:underline;">← 마이페이지로</a></p>

  <div id="deniedNote" class="card" style="display:none;">
    <div class="empty-note">관리자만 접근할 수 있는 페이지예요.</div>
  </div>

  <div id="adminCard" class="card" style="display:none;">
    <h2>사용자 충전하기</h2>
    <p class="hint" style="margin-top:-6px; margin-bottom:16px;">결제 확인 후 이메일과 충전할 횟수를 입력하면, 그 계정의 AI 생성 가능 횟수가 즉시 늘어나요.</p>
    <div class="field-block">
      <label>사용자 이메일</label>
      <input type="email" id="targetEmail" placeholder="customer@example.com">
    </div>
    <div class="field-block">
      <label>충전할 생성 횟수</label>
      <input type="number" id="chargeAmount" value="10" min="1">
    </div>
    <button class="primary" onclick="chargeUser()">충전하기</button>
    <div class="status" id="chargeStatus"></div>
  </div>

</div>

<script>
let currentUser = null;

requireAuth(function(user){
  currentUser = user;
  renderUserChip(user);
  checkAdminAccess();
});

async function checkAdminAccess(){
  const { data } = await sb.from('profiles').select('is_admin').eq('id', currentUser.id).single();
  if(!data || !data.is_admin){
    document.getElementById('deniedNote').style.display = 'block';
    return;
  }
  document.getElementById('adminCard').style.display = 'block';
}

async function chargeUser(){
  const email = document.getElementById('targetEmail').value.trim();
  const amount = parseInt(document.getElementById('chargeAmount').value, 10);
  const statusEl = document.getElementById('chargeStatus');

  if(!email){
    statusEl.textContent = '이메일을 입력해주세요.';
    statusEl.className = 'status err';
    return;
  }
  if(!amount || amount < 1){
    statusEl.textContent = '1 이상의 숫자를 입력해주세요.';
    statusEl.className = 'status err';
    return;
  }

  statusEl.textContent = '조회 중...';
  statusEl.className = 'status';

  const { data: target, error: findError } = await sb
    .from('profiles')
    .select('id, email, ai_generations_used, ai_generations_limit')
    .eq('email', email)
    .maybeSingle();

  if(findError || !target){
    statusEl.textContent = '해당 이메일의 사용자를 찾을 수 없어요.';
    statusEl.className = 'status err';
    return;
  }

  const newLimit = (target.ai_generations_limit || 0) + amount;
  const { error: updateError } = await sb
    .from('profiles')
    .update({ ai_generations_limit: newLimit })
    .eq('id', target.id);

  if(updateError){
    statusEl.textContent = '충전 실패: ' + updateError.message;
    statusEl.className = 'status err';
    return;
  }

  statusEl.textContent = `충전 완료! ${email} 님의 한도가 ${newLimit}회로 늘었어요. (지금까지 사용: ${target.ai_generations_used}회)`;
  statusEl.className = 'status ok';
  document.getElementById('targetEmail').value = '';
}
</script>
</body>
</html>
