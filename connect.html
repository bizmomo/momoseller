<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>쇼핑몰 연동 | 모모셀러</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link href="shared.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div>
      <h1>쇼핑몰 연동</h1>
      <p>연결한 계정 기준으로 홈 화면 대시보드가 채워져요.</p>
    </div>
  </div>

  <p style="margin:-10px 0 20px;"><a href="my.html" style="font-size:12.5px; color:var(--accent-deep); text-decoration:underline;">← 마이페이지로</a></p>

  <div class="card">
    <h2>쿠팡 연동</h2>
    <div class="hint" id="coupangStatus" style="margin-bottom:14px;">확인 중...</div>
    <div class="field-block">
      <label>업체코드 (Vendor ID)</label>
      <input type="text" id="coupangVendorId" placeholder="예: A00012345">
    </div>
    <div class="field-block">
      <label>Access Key</label>
      <input type="text" id="coupangAccessKey" placeholder="쿠팡윙에서 발급받은 Access Key">
    </div>
    <div class="field-block">
      <label>Secret Key</label>
      <input type="password" id="coupangSecretKey" placeholder="쿠팡윙에서 발급받은 Secret Key">
    </div>
    <button class="primary" onclick="saveCoupangCredentials()">저장하기</button>
    <div class="status" id="coupangSaveStatus"></div>
  </div>

  <div class="card">
    <h2>네이버 연동</h2>
    <div class="hint" id="naverStatus" style="margin-bottom:14px;">확인 중...</div>
    <div class="field-block">
      <label>Client ID</label>
      <input type="text" id="naverClientId" placeholder="네이버 커머스API센터에서 발급받은 Client ID">
    </div>
    <div class="field-block">
      <label>Client Secret</label>
      <input type="password" id="naverClientSecret" placeholder="네이버 커머스API센터에서 발급받은 Client Secret">
    </div>
    <button class="primary" onclick="saveNaverCredentials()">저장하기</button>
    <div class="status" id="naverSaveStatus"></div>
  </div>

</div>

<nav class="bottom-nav"><div class="bottom-nav-inner">
  <a href="home.html" class="nav-item"><span class="nav-icon">🏠</span><span>홈</span></a>
  <a href="index.html" class="nav-item"><span class="nav-icon">✍️</span><span>상품등록</span></a>
  <a href="settlement.html" class="nav-item"><span class="nav-icon">📊</span><span>정산</span></a>
  <a href="analysis.html" class="nav-item"><span class="nav-icon">📈</span><span>분석</span></a>
  <a href="my.html" class="nav-item"><span class="nav-icon">👤</span><span>마이</span></a>
</div></nav>

<script>
let currentUser = null;

requireAuth(function(user){
  currentUser = user;
  checkCoupangStatus();
  checkNaverStatus();
});

async function checkCoupangStatus(){
  const { data } = await sb.from('profiles').select('coupang_vendor_id').eq('id', currentUser.id).single();
  const statusEl = document.getElementById('coupangStatus');
  if(data && data.coupang_vendor_id){
    statusEl.textContent = `연동됨 (업체코드: ${data.coupang_vendor_id})`;
    statusEl.style.color = 'var(--teal)';
  } else {
    statusEl.textContent = '아직 연동 안 됐어요.';
    statusEl.style.color = '';
  }
}

async function saveCoupangCredentials(){
  const vendorId = document.getElementById('coupangVendorId').value.trim();
  const accessKey = document.getElementById('coupangAccessKey').value.trim();
  const secretKey = document.getElementById('coupangSecretKey').value.trim();
  const statusEl = document.getElementById('coupangSaveStatus');

  if(!vendorId || !accessKey || !secretKey){
    statusEl.textContent = '업체코드, Access Key, Secret Key를 모두 입력해주세요.';
    statusEl.className = 'status err';
    return;
  }

  statusEl.textContent = '저장 중...';
  statusEl.className = 'status';

  const { data, error } = await sb.functions.invoke('save-coupang-credentials', {
    body: { vendorId, accessKey, secretKey }
  });

  if(error || !data || data.error){
    statusEl.textContent = data?.error || ('저장 실패: ' + (await getInvokeErrorMessage(error)));
    statusEl.className = 'status err';
    return;
  }

  statusEl.textContent = '저장됐어요!';
  statusEl.className = 'status ok';
  document.getElementById('coupangAccessKey').value = '';
  document.getElementById('coupangSecretKey').value = '';
  checkCoupangStatus();
}

async function checkNaverStatus(){
  const { data } = await sb.from('profiles').select('naver_client_id').eq('id', currentUser.id).single();
  const statusEl = document.getElementById('naverStatus');
  if(data && data.naver_client_id){
    statusEl.textContent = `연동됨 (Client ID: ${data.naver_client_id})`;
    statusEl.style.color = 'var(--teal)';
  } else {
    statusEl.textContent = '아직 연동 안 됐어요.';
    statusEl.style.color = '';
  }
}

async function saveNaverCredentials(){
  const clientId = document.getElementById('naverClientId').value.trim();
  const clientSecret = document.getElementById('naverClientSecret').value.trim();
  const statusEl = document.getElementById('naverSaveStatus');

  if(!clientId || !clientSecret){
    statusEl.textContent = 'Client ID와 Client Secret을 모두 입력해주세요.';
    statusEl.className = 'status err';
    return;
  }

  statusEl.textContent = '저장 중...';
  statusEl.className = 'status';

  const { data, error } = await sb.functions.invoke('save-naver-credentials', {
    body: { clientId, clientSecret }
  });

  if(error || !data || data.error){
    statusEl.textContent = data?.error || ('저장 실패: ' + (await getInvokeErrorMessage(error)));
    statusEl.className = 'status err';
    return;
  }

  statusEl.textContent = '저장됐어요!';
  statusEl.className = 'status ok';
  document.getElementById('naverClientSecret').value = '';
  checkNaverStatus();
}
</script>
</body>
</html>
