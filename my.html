<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>마이페이지 | 모모셀러</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link href="shared.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div>
      <h1>마이페이지</h1>
      <p>내 계정 정보를 확인하고 관리해요.</p>
    </div>
  </div>

  <div class="card">
    <h2>저장된 기록</h2>
    <p class="hint" style="margin-top:0; margin-bottom:14px;">예전에 만든 프롬프트를 다시 불러올 수 있어요.</p>
    <a href="history.html" style="text-decoration:none;">
      <button class="primary">기록 보기</button>
    </a>
  </div>

  <div class="card">
    <h2>쇼핑몰 연동</h2>
    <p class="hint" style="margin-top:0; margin-bottom:14px;">쿠팡·네이버 계정을 연결하면 홈 화면에서 내 가게 매출을 볼 수 있어요.</p>
    <a href="connect.html" style="text-decoration:none;">
      <button class="primary">연동 관리로 이동</button>
    </a>
  </div>

  <div class="card" id="adminCenterCard" style="display:none;">
    <h2>운영자 센터</h2>
    <p class="hint" style="margin-top:0; margin-bottom:14px;">결제 확인된 고객에게 AI 생성 횟수를 충전해줄 수 있어요.</p>
    <a href="admin.html" style="text-decoration:none;">
      <button class="primary">충전 관리로 이동</button>
    </a>
  </div>

  <div class="card">
    <h2 onclick="toggleAccountInfo()" style="cursor:pointer; display:flex; justify-content:space-between; align-items:center; margin-bottom:0;">
      계정 정보
      <svg id="accountChevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transition:transform 0.2s;"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </h2>
    <div id="accountDetails" style="display:none; margin-top:16px;">
      <div class="field-block">
        <label>이메일</label>
        <div id="myEmail" style="font-size:14px;"></div>
      </div>
      <div class="field-block">
        <label>새 비밀번호 (6자 이상)</label>
        <input type="password" id="newPassword" placeholder="새 비밀번호">
      </div>
      <button class="secondary" onclick="changePassword()">비밀번호 변경</button>
      <div class="status" id="passwordStatus"></div>
      <button class="secondary" onclick="signOut()" style="margin-top:10px;">로그아웃</button>
    </div>
  </div>

</div>

<nav class="bottom-nav"><div class="bottom-nav-inner">
  <a href="home.html" class="nav-item"><span class="nav-icon">🏠</span><span>홈</span></a>
  <a href="index.html" class="nav-item"><span class="nav-icon">✍️</span><span>프롬프트</span></a>
  <a href="settlement.html" class="nav-item"><span class="nav-icon">📊</span><span>정산</span></a>
  <a href="analysis.html" class="nav-item"><span class="nav-icon">📈</span><span>분석</span></a>
  <a href="my.html" class="nav-item active"><span class="nav-icon">👤</span><span>마이</span></a>
</div></nav>

<script>
let currentUser = null;

requireAuth(function(user){
  currentUser = user;
  document.getElementById('myEmail').textContent = user.email;
  checkAdminCenter();
});

async function checkAdminCenter(){
  const { data } = await sb.from('profiles').select('is_admin').eq('id', currentUser.id).single();
  if(data && data.is_admin){
    document.getElementById('adminCenterCard').style.display = 'block';
  }
}

let accountExpanded = false;
function toggleAccountInfo(){
  accountExpanded = !accountExpanded;
  document.getElementById('accountDetails').style.display = accountExpanded ? 'block' : 'none';
  document.getElementById('accountChevron').style.transform = accountExpanded ? 'rotate(180deg)' : 'rotate(0deg)';
}

async function changePassword(){
  const newPassword = document.getElementById('newPassword').value;
  const statusEl = document.getElementById('passwordStatus');

  if(!newPassword || newPassword.length < 6){
    statusEl.textContent = '6자 이상 입력해주세요.';
    statusEl.className = 'status err';
    return;
  }

  statusEl.textContent = '변경 중...';
  statusEl.className = 'status';

  const { error } = await sb.auth.updateUser({ password: newPassword });

  if(error){
    statusEl.textContent = '변경 실패: ' + error.message;
    statusEl.className = 'status err';
    return;
  }

  statusEl.textContent = '비밀번호가 변경됐어요.';
  statusEl.className = 'status ok';
  document.getElementById('newPassword').value = '';
}
</script>
</body>
</html>
