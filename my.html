<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>마이페이지 | 모모셀러</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link href="shared.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div>
      <h1>마이페이지</h1>
      <p>내 계정 정보를 확인하고 관리해요.</p>
    </div>
  </div>

  <div class="card">
    <h2>계정 정보</h2>
    <div class="field-block">
      <label>이메일</label>
      <div id="myEmail" style="font-size:14px;"></div>
    </div>
    <button class="secondary" onclick="signOut()">로그아웃</button>
  </div>

  <div class="card">
    <h2>쇼핑몰 연동</h2>
    <p class="hint" style="margin-top:0; margin-bottom:12px;">내 쿠팡 계정을 연결하면 홈 화면에서 내 가게의 오늘 매출을 볼 수 있어요.</p>
    <div class="hint" id="coupangStatus" style="margin-bottom:14px;">확인 중...</div>
    <div class="field-block">
      <label>업체코드 (Vendor ID)</label>
      <input type="text" id="coupangVendorId" placeholder="예: A00012345">
    </div>
    <div class="field-block">
      <label>Access Key</label>
      <input type="text" id="coupangAccessKey" placeholder="쿠팡윙에서 발급받은 Access Key">
    </div>
    <div class="field-block">
      <label>Secret Key</label>
      <input type="password" id="coupangSecretKey" placeholder="쿠팡윙에서 발급받은 Secret Key">
    </div>
    <button class="primary" onclick="saveCoupangCredentials()">저장하기</button>
    <div class="status" id="coupangSaveStatus"></div>
  </div>

  <div class="card" id="adminCenterCard" style="display:none;">
    <h2>운영자 센터</h2>
    <p class="hint" style="margin-top:0; margin-bottom:14px;">결제 확인된 고객에게 AI 생성 횟수를 충전해줄 수 있어요.</p>
    <a href="admin.html" style="text-decoration:none;">
      <button class="primary">충전 관리로 이동</button>
    </a>
  </div>

</div>

<nav class="bottom-nav"><div class="bottom-nav-inner">
  <a href="home.html" class="nav-item"><span class="nav-icon">🏠</span><span>홈</span></a>
  <a href="index.html" class="nav-item"><span class="nav-icon">✍️</span><span>프롬프트</span></a>
  <a href="settlement.html" class="nav-item"><span class="nav-icon">📊</span><span>정산</span></a>
  <a href="analysis.html" class="nav-item"><span class="nav-icon">📈</span><span>분석</span></a>
  <a href="history.html" class="nav-item"><span class="nav-icon">🗂️</span><span>기록</span></a>
</div></nav>

<script>
let currentUser = null;

requireAuth(function(user){
  currentUser = user;
  document.getElementById('myEmail').textContent = user.email;
  checkAdminCenter();
  checkCoupangStatus();
});

async function checkAdminCenter(){
  const { data } = await sb.from('profiles').select('is_admin').eq('id', currentUser.id).single();
  if(data && data.is_admin){
    document.getElementById('adminCenterCard').style.display = 'block';
  }
}

async function checkCoupangStatus(){
  const { data } = await sb.from('profiles').select('coupang_vendor_id').eq('id', currentUser.id).single();
  const statusEl = document.getElementById('coupangStatus');
  if(data && data.coupang_vendor_id){
    statusEl.textContent = `연동됨 (업체코드: ${data.coupang_vendor_id})`;
    statusEl.style.color = 'var(--teal)';
  } else {
    statusEl.textContent = '아직 연동 안 됐어요.';
    statusEl.style.color = '';
  }
}

async function saveCoupangCredentials(){
  const vendorId = document.getElementById('coupangVendorId').value.trim();
  const accessKey = document.getElementById('coupangAccessKey').value.trim();
  const secretKey = document.getElementById('coupangSecretKey').value.trim();
  const statusEl = document.getElementById('coupangSaveStatus');

  if(!vendorId || !accessKey || !secretKey){
    statusEl.textContent = '업체코드, Access Key, Secret Key를 모두 입력해주세요.';
    statusEl.className = 'status err';
    return;
  }

  statusEl.textContent = '저장 중...';
  statusEl.className = 'status';

  const { data, error } = await sb.functions.invoke('save-coupang-credentials', {
    body: { vendorId, accessKey, secretKey }
  });

  if(error || !data || data.error){
    statusEl.textContent = data?.error || ('저장 실패: ' + (await getInvokeErrorMessage(error)));
    statusEl.className = 'status err';
    return;
  }

  statusEl.textContent = '저장됐어요!';
  statusEl.className = 'status ok';
  document.getElementById('coupangAccessKey').value = '';
  document.getElementById('coupangSecretKey').value = '';
  checkCoupangStatus();
}
</script>
</body>
</html>
